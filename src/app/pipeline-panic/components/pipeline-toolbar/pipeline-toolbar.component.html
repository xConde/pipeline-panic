<div class="controls-bar" role="toolbar" aria-label="Patch bay controls">
  <button
    type="button"
    class="ctrl-btn"
    (click)="undoClick.emit()"
    [disabled]="readOnly() || !canUndo() || isRunning()"
    title="Undo route change (Ctrl+Z)"
    aria-label="Undo route change"
  >
    <span [innerHTML]="getIcon('undo', 14)"></span><span class="btn-text">Undo</span>
  </button>
  <button
    type="button"
    class="ctrl-btn"
    (click)="redoClick.emit()"
    [disabled]="readOnly() || !canRedo() || isRunning()"
    title="Redo route change (Ctrl+Shift+Z)"
    aria-label="Redo route change"
  >
    <span [innerHTML]="getIcon('redo', 14)"></span><span class="btn-text">Redo</span>
  </button>
  <button
    type="button"
    class="ctrl-btn restore-btn"
    (click)="restoreClick.emit()"
    [disabled]="readOnly() || isRunning()"
    title="Restore the dealt route"
    aria-label="Restore dealt route"
  >
    <span [innerHTML]="getIcon('arrowsClockwise', 14)"></span><span class="btn-text">Restore route</span>
  </button>
  <button
    type="button"
    class="ctrl-btn"
    (click)="deleteClick.emit()"
    [disabled]="readOnly() || !hasSelection() || isRunning()"
    title="Remove selected stage"
    aria-label="Remove selected stage"
  >
    <span [innerHTML]="getIcon('trash', 14)"></span><span class="btn-text">Remove</span>
  </button>
  <button
    type="button"
    class="ctrl-btn connect-btn"
    [class.active]="connectModeActive()"
    (click)="connectModeToggle.emit()"
    [disabled]="readOnly() || isRunning()"
    [title]="connectModeActive() ? 'Cancel connection' : 'Connect two stages'"
    [attr.aria-pressed]="connectModeActive()"
    aria-label="Connect two stages"
  >
    <span class="btn-text">Connect</span>
    <span class="connect-icon" aria-hidden="true">⇢</span>
  </button>
  <button
    type="button"
    class="ctrl-btn stop-btn"
    (click)="stopClick.emit()"
    [disabled]="!isRunning()"
    title="Stop dispatch"
    aria-label="Stop dispatch"
  >
    <span [innerHTML]="getIcon('stop', 14)"></span><span class="btn-text">Stop</span>
  </button>
</div>
